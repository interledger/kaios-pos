<!doctype html>
<html lang="en" class="w-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interledger POS</title>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        var msg = '[JS Error] ' + event.message + ' at ' + event.filename + ':' + event.lineno + ':' + event.colno;
        var pre = document.createElement('pre');
        pre.style.color = 'red';
        pre.style.background = '#fff0f0';
        pre.style.fontSize = '12px';
        pre.style.padding = '4px';
        pre.textContent = msg;
        document.body.appendChild(pre);
      });
    </script>
  </body>
</html>
